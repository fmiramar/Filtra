name: Build and Release Filtra

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            ext: .so
          - os: windows-2022
            platform: windows-x64
            ext: .scx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libasound2-dev libsndfile1-dev

      - name: Clone SuperCollider headers
        run: |
          git clone --depth 1 --branch Version-3.14.0 https://github.com/supercollider/supercollider.git sc-source

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSC_PATH=sc-source

      - name: Build plugin
        run: |
          cmake --build build --config Release

      - name: Package extension archive
        run: |
          VERSION=${GITHUB_REF_NAME:-v0.1.0}
          export PKG_NAME="Filtra-${VERSION}-${{ matrix.platform }}"
          mkdir -p "pkg/${PKG_NAME}"
          cmake --install build --config Release --prefix "pkg/${PKG_NAME}/Extensions/Filtra"
          cp README.md LICENSE SOURCES.md "pkg/${PKG_NAME}/" 2>/dev/null || true
          
          python -c "
          import os, shutil
          pkg = os.environ['PKG_NAME']
          readme_path = os.path.join('pkg', pkg, 'README-INSTALL.txt')
          with open(readme_path, 'w', encoding='utf-8') as f:
              f.write('''Filtra - A SuperCollider UGen Suite for Filter and Resonance\n============================================================\n\nInstallation:\n1. Open SuperCollider and run:\n       Platform.userExtensionDir.postln;\n2. Copy the enclosed 'Extensions/Filtra' folder into that directory.\n3. Recompile class library in SuperCollider (Cmd+Shift+L on macOS, Ctrl+Shift+L on Linux/Windows).\n4. Explore examples/ or open the guide in SuperCollider: Guides/Filtra\n''')
          shutil.make_archive(os.path.join('pkg', pkg), 'zip', 'pkg', pkg)
          "
          echo "ARCHIVE_PATH=pkg/${PKG_NAME}.zip" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=${PKG_NAME}.zip" >> $GITHUB_ENV

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
